name: MyDrive
options:
  bundleIdPrefix: com.biolynk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: WSLRC7P5X9
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MyDrive:
    type: application
    platform: iOS
    sources:
      - path: MyDrive
      - path: ../shared/car-catalog.json
        buildPhase: resources
      - path: ../shared/cars
        type: folder
        buildPhase: resources
      - path: ../shared/sounds
        type: folder
        buildPhase: resources
      - path: ../shared/briefing/greetings.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biolynk.mydrive
        INFOPLIST_FILE: Config/MyDrive-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/MyDrive.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/MyDrive-Sim.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MyDriveWidget
  MyDriveWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MyDriveWidget
      - path: MyDrive/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biolynk.mydrive.widget
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
  MyDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyDriveTests
    dependencies:
      - target: MyDrive
schemes:
  MyDrive:
    build:
      targets:
        MyDrive: all
    test:
      targets:
        - MyDriveTests
