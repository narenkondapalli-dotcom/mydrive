name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen

      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available iPhone -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if 'iPhone' in x['name']))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build and test (MyDrive scheme, simulator, no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project MyDrive.xcodeproj \
            -scheme MyDrive \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | xcpretty || (grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -50; exit 1)
